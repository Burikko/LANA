name: Build APK Lana A70

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          # Kunci Cython ke versi stabil untuk Kivy/p4a
          pip install "cython<3.0" buildozer kivy

      - name: Fix Android SDK & AIDL for A70
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          # Install Build-Tools 29 (Standar Android 10/A70) agar AIDL stabil
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;29.0.3" "platforms;android-29" "ndk;25.2.9519653"
          # Paksa link aidl ke sistem
          sudo ln -sf $ANDROID_HOME/build-tools/29.0.3/aidl /usr/local/bin/aidl
          # Terima semua lisensi secara paksa
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build APK
        run: |
          # Bersihkan sisa build gagal
          rm -rf .buildozer
          rm -rf bin
          # Jalankan build dengan verbose
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lana-a70-apk
          path: bin/*.apk
