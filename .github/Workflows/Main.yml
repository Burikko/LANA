steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ... (Langkah install python & system dependencies) ...

      - name: Pre-install NDK & Accept Licenses
        run: |
          # Perintah ini untuk mengunduh NDK secara manual agar tidak error "closed file"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "ndk;25.2.9519653"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Build APK
        run: |
          # Gunakan perintah buildozer di sini
          buildozer -v android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
