- name: Force Install SDK Components & Accept Licenses
        run: |
          # 1. Pastikan folder cmdline-tools terbaru ada di path
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

          # 2. Terima SEMUA lisensi (Solusi utama error di foto Anda)
          yes | sdkmanager --licenses || true

          # 3. Instal versi 33.0.0 (Sangat disarankan untuk Kivy/Buildozer saat ini)
          # Versi 30.0.3 kadang terlalu tua untuk Kivy versi terbaru
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" "ndk;25.2.9519653"

      - name: Build APK
        run: |
          # TIPS: Jangan hapus .buildozer di awal jika ingin cepat, 
          # tapi karena ini GitHub Actions (fresh runner), biarkan saja.
          
          # Beri tahu Buildozer di mana letak SDK agar tidak download ulang yang rusak
          export ANDROID_SDK_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          
          # Jalankan build
          buildozer -v android debug
        env:
          # Ini variabel lingkungan penting untuk otomatisasi
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
