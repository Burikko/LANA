name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython kivy

      - name: Fix Android SDK and Install AIDL
        run: |
          # Mengatur path SDK agar Buildozer tidak bingung
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          # Instal build-tools spesifik yang stabil untuk AIDL
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.1" "platforms;android-33"
          # Paksa link aidl ke path sistem agar Buildozer menemukannya tanpa gagal
          sudo ln -sf $ANDROID_HOME/build-tools/33.0.1/aidl /usr/local/bin/aidl
          echo "AIDL version:"
          aidl -version || echo "AIDL link failed but continuing..."

      - name: Build APK
        run: |
          # Bersihkan sisa build gagal sebelumnya
          rm -rf .buildozer
          # Jalankan build dengan mode verbose agar kita bisa lihat errornya di mana
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lana-apk
          path: bin/*.apk
