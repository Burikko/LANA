name: Build APK Lana A70

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          # Kunci Cython agar stabil dengan Kivy/p4a
          pip install "cython<3.0" buildozer kivy

      - name: Force Install AIDL & SDK Tools
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          # Gunakan versi 30.0.3 (Sangat stabil untuk Android 9/10/11)
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;30.0.3" "platforms;android-30" "ndk;25.2.9519653"
          
          # Paksa link AIDL agar terdeteksi global
          if [ -f "$ANDROID_HOME/build-tools/30.0.3/aidl" ]; then
            sudo ln -sf $ANDROID_HOME/build-tools/30.0.3/aidl /usr/local/bin/aidl
            echo "AIDL 30.0.3 Terpasang!"
          else
            echo "Mencoba jalur alternatif build-tools 33..."
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.0"
            sudo ln -sf $ANDROID_HOME/build-tools/33.0.0/aidl /usr/local/bin/aidl
          fi
          
          # Terima semua lisensi secara paksa
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses

      - name: Build APK
        run: |
          # Hapus sisa build gagal agar benar-benar fresh
          rm -rf .buildozer
          rm -rf bin
          # Jalankan build dengan log detail (verbose)
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lana-a70-apk
          path: bin/*.apk
